<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hotels</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .content{padding:0 18px 32px 18px; display:flex; flex-direction:column; gap:12px;}
  .hotel-card{background:#fff; border-radius:18px; overflow:hidden; box-shadow:0 1px 4px rgba(27,42,74,0.06);}
  .hotel-top{height:84px; display:flex; align-items:center; justify-content:center; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:26px; color:#fff;}
  .hotel-body{padding:13px 16px;}
  .hotel-body h3{margin:0 0 3px 0; font-size:15px; color:var(--navy);}
  .hotel-body p.dist{margin:0 0 8px 0; font-size:11.5px; color:var(--muted);}
  .hotel-row{display:flex; gap:8px;}
  .hotel-row a, .hotel-row button{flex:1; text-align:center; font-size:12.5px; font-weight:700; border-radius:11px; padding:10px; min-height:40px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
</style>
</head>
<body>
<div class="app-shell">
  <div class="header">
    <a class="back" href="index.html" aria-label="Back to Home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="2.2"><path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <h1>Hotels</h1>
  </div>
  <div class="content" id="hotels"></div>
  <div id="bottomNavMount"></div>
</div>

<script src="app.js"></script>
<script>
(function(){
  "use strict";
  var HOTELS = [
    { name:"Marina Bay Sands", area:"Marina Bay · ~15 min to park gate", tint:"linear-gradient(135deg,#1E7D9C,#1B2A4A)", site:"https://www.marinabaysands.com/hotel.html" },
    { name:"Travelodge Harbourfront", area:"HarbourFront · ~8 min to park gate", tint:"linear-gradient(135deg,#6B4FA0,#1B2A4A)", site:"https://www.travelodge.com.sg/" },
    { name:"Resorts World Sentosa", area:"Sentosa · ~10 min to park gate", tint:"linear-gradient(135deg,#C65D7B,#1B2A4A)", site:"https://www.rwsentosa.com/en/hotels" }
  ];
  var wrap = document.getElementById("hotels");
  HOTELS.forEach(function(h){
    var card = document.createElement("div");
    card.className = "hotel-card";
    var mapsUrl = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(h.name) + "&destination_place_id=&travelmode=driving&dir_action=navigate" +
      "&destination=" + encodeURIComponent("Pulau Brani, Singapore");
    card.innerHTML =
      '<div class="hotel-top" style="background:' + h.tint + '">' + h.name.slice(0,2) + '</div>' +
      '<div class="hotel-body"><h3>' + h.name + '</h3><p class="dist">' + h.area + '</p>' +
      '<div class="hotel-row">' +
        '<a href="' + h.site + '" target="_blank" rel="noopener" class="btn-outline">Book Now</a>' +
        '<a href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(h.name + " Singapore") + '" target="_blank" rel="noopener" class="btn-primary" style="text-decoration:none;">Directions</a>' +
      '</div></div>';
    wrap.appendChild(card);
  });
  document.getElementById("bottomNavMount").innerHTML = "";
  DLSG.renderBottomNav("");
})();
</script>
</body>
</html>
