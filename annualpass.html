<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Annual Pass</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .hero{margin:20px 18px; background:linear-gradient(135deg,#6B4FA0,#1B2A4A); border-radius:22px; padding:34px 22px; text-align:center; color:#fff;}
  .hero .star{width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,.15); display:flex; align-items:center; justify-content:center; margin:0 auto 14px auto;}
  .hero h2{margin:0 0 6px 0; font-size:19px;}
  .hero p{margin:0; font-size:12.5px; color:#D9D2F0; line-height:1.5;}
  .content{padding:0 18px 32px 18px;}
  .perk{display:flex; gap:10px; background:#fff; border-radius:14px; padding:12px 14px; box-shadow:0 1px 4px rgba(27,42,74,0.06); margin-bottom:10px; align-items:center;}
  .perk span{font-size:12.5px; font-weight:600; color:var(--navy);}
  .notify-card{background:#fff; border-radius:16px; padding:16px; box-shadow:0 1px 4px rgba(27,42,74,0.06); margin-top:6px;}
  .notify-card p{margin:0 0 10px 0; font-size:12.5px; color:#6B7280;}
</style>
</head>
<body>
<div class="app-shell">
  <div class="header">
    <a class="back" href="index.html" aria-label="Back to Home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="2.2"><path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <h1>Annual Pass</h1>
  </div>

  <div class="hero">
    <div class="star"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 3l2.5 5 5.5.8-4 4 1 5.5L12 15.7 7 18.3l1-5.5-4-4 5.5-.8z" stroke-linejoin="round"/></svg></div>
    <h2>Coming Soon</h2>
    <p>Our Annual Pass programme is still being finalised. Be the first to know when unlimited-visit passes go on sale.</p>
  </div>

  <div class="content">
    <div class="perk"><span>✨ Unlimited visits for 12 months</span></div>
    <div class="perk"><span>🎟️ Priority Access credits every quarter</span></div>
    <div class="perk"><span>🏷️ Member discounts on Dining &amp; Merch</span></div>

    <div class="notify-card">
      <p>Want an email the moment passes launch?</p>
      <button class="btn-primary" style="width:100%;" id="notifyBtn">Notify Me</button>
    </div>
  </div>
  <div id="bottomNavMount"></div>
</div>

<script src="app.js"></script>
<script>
(function(){
  "use strict";
  document.getElementById("notifyBtn").addEventListener("click", function(){
    var b = this;
    DLSG.set("annualNotify", true);
    b.textContent = "You're on the list ✓";
    b.disabled = true;
    DLSG.toast("We'll email you when Annual Passes launch");
  });
  if(DLSG.get("annualNotify", false)){
    document.getElementById("notifyBtn").textContent = "You're on the list ✓";
    document.getElementById("notifyBtn").disabled = true;
  }
  document.getElementById("bottomNavMount").innerHTML = "";
  DLSG.renderBottomNav("");
})();
</script>
</body>
</html>
