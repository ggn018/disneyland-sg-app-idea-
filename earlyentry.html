<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Early Park Entry</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .content{padding:0 18px 32px 18px;}
  .intro{background:#fff; border-radius:16px; padding:14px 16px; box-shadow:0 1px 4px rgba(27,42,74,0.06); margin-bottom:16px; display:flex; gap:10px; align-items:flex-start;}
  .intro p{margin:0; font-size:12.5px; color:#6B7280; line-height:1.5;}
  .cal-card{background:#fff; border-radius:18px; padding:14px 16px; margin-bottom:16px; box-shadow:0 1px 4px rgba(27,42,74,0.06);}
  .cal-head h3{margin:0 0 10px 0; font-size:14px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
  .cal-dow{font-size:9.5px; color:var(--muted); text-align:center; font-weight:700;}
  .cal-day{aspect-ratio:1; border:none; border-radius:9px; font-size:12px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; background:#E4EAF7; color:#1E7D9C;}
  .cal-day.sel{outline:2.5px solid var(--navy); outline-offset:1px;}
  .qr-card{background:var(--navy); border-radius:20px; padding:18px; color:#fff;}
  .qr-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .qr-top p.lbl{margin:0; font-size:11px; color:#9FACC8; font-weight:600; text-transform:uppercase; letter-spacing:0.04em;}
  .qr-top p.name{margin:2px 0 0 0; font-size:15px; font-weight:800;}
  .qr-top p.price{margin:0; font-size:19px; font-weight:800; color:var(--gold);}
</style>
</head>
<body>
<div class="app-shell">
  <div class="header">
    <a class="back" href="index.html" aria-label="Back to Home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="2.2"><path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <h1>Early Park Entry</h1>
  </div>

  <div class="content">
    <div class="intro">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E7D9C" stroke-width="2" style="flex-shrink:0;"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/></svg>
      <p>Enter the park 45 minutes before general opening. Add this to any ticket date for a flat <strong>+S$20</strong> per guest.</p>
    </div>

    <div class="cal-card">
      <div class="cal-head"><h3>Choose your date — January 2034</h3></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <div class="qr-card">
      <div class="qr-top">
        <div><p class="lbl">Early Entry</p><p class="name" id="selDate">10 Jan 2034</p></div>
        <p class="price" id="selPrice">+S$20</p>
      </div>
      <button class="btn-primary" style="width:100%; background:var(--gold); color:#1B2A4A;" id="payBtn">Pay &amp; Confirm</button>
    </div>
  </div>
  <div id="bottomNavMount"></div>
</div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="confirmSheet">
  <button class="close-x" id="sheetClose">&times;</button>
  <div class="sheet-body" style="padding-top:30px; text-align:center;">
    <div style="width:64px; height:64px; border-radius:50%; background:#E3F1E8; display:flex; align-items:center; justify-content:center; margin:0 auto 14px auto;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2F7A4D" stroke-width="2.5"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h2 style="text-align:center;">Paid!</h2>
    <p class="desc" style="text-align:center;">Disney can't wait to see you then!</p>
    <button class="btn-primary" style="width:100%; margin-top:10px;" id="confirmDone">Done</button>
  </div>
</div>

<script src="app.js"></script>
<script>
(function(){
  "use strict";
  var selDate = 10;
  function renderCal(){
    var grid = document.getElementById("calGrid");
    grid.innerHTML = "";
    ["S","M","T","W","T","F","S"].forEach(function(d){
      var el = document.createElement("div"); el.className = "cal-dow"; el.textContent = d; grid.appendChild(el);
    });
    for(var day=1; day<=31; day++){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "cal-day" + (day === selDate ? " sel" : "");
      btn.textContent = day;
      btn.addEventListener("click", function(d){ return function(){ selDate = d; render(); }; }(day));
      grid.appendChild(btn);
    }
  }
  function render(){
    renderCal();
    document.getElementById("selDate").textContent = selDate + " Jan 2034";
  }
  document.getElementById("payBtn").addEventListener("click", function(){
    DLSG.addTicket({ name:"Early Park Entry", date:selDate + " Jan 2034", price:"+S$20", method:"—" });
    document.getElementById("overlay").classList.add("show");
    document.getElementById("confirmSheet").classList.add("show");
  });
  function close(){ document.getElementById("overlay").classList.remove("show"); document.getElementById("confirmSheet").classList.remove("show"); }
  document.getElementById("sheetClose").addEventListener("click", close);
  document.getElementById("overlay").addEventListener("click", close);
  document.getElementById("confirmDone").addEventListener("click", function(){ close(); window.location.href = "me.html"; });
  render();
  document.getElementById("bottomNavMount").innerHTML = "";
  DLSG.renderBottomNav("");
})();
</script>
</body>
</html>
